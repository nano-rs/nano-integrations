name: Netskope
slug: netskope
category: collector
description: "Pull events and alerts from a Netskope tenant via the REST API v2 Data Export iterator"
icon: cloud
author: nano
version: 6
changelog: >-
  v6: start point-forward (NAN-3697). A new iterator opens at the activation
  time minus 5 minutes instead of now. Existing iterators are resumed
  unchanged. There is no backfill option.
  v5: streams name the OCSF parser (netskope_ocsf) instead of the pre-OCSF
  netskope parser. Parser lookup is by name, and OCSF tenants only carry the
  *_ocsf parsers, so every stream provisioned on an OCSF tenant arrived
  unparsed (NAN-3483). A stream that is already linked keeps its log source:
  disable and re-enable it to provision against the OCSF parser.
  v4: each stream now names the parser it needs (parser: netskope) instead of
  relying on the parser to claim all nine netskope_* source types. Resolution no
  longer depends on the parsers repo keeping those aliases, so a parser-repo
  tidy-up can't silently leave streams collecting unparsed. No behaviour change
  on its own; update before the parsers repo drops the aliases.
  v3: fetched-but-unconfirmed pages are now re-served with operation=resend
  instead of being walked past. Netskope's read position is server-side and
  advances when a page is served, so a page whose emit failed was previously
  lost permanently — the index had already moved on. DATA-LOSS FIX; update.
  v2: TENANT_HOST is declared field_type: hostname, which is what opts it into
  the outbound host policy (NAN-2201). Without it the tenant host is not
  admitted to the sandbox allowlist and every request is denied. Behavioural
  fix — reinstall or update to pick it up.
  v1: initial release — nine dataexport event streams over the v2 iterator API.

auth_type: api_key_header
auth:
  header_name: Netskope-API-Token
  credential_field: API_TOKEN

requires_credential: required
credential_fields:
  - name: API_TOKEN
    label: API Token
    field_type: secret
    required: true
    help: >-
      Netskope UI → Settings → Administration → Administrators → Service Account.
      Create a REST API v2 token and grant it read access to each
      /api/v2/events/dataexport/events/* endpoint you enable below — the token
      is scoped per endpoint, and a missing grant returns 403 for that stream
      only.

config_fields:
  - name: TENANT_HOST
    # `hostname` opts this field into host-policy checking: its value must
    # satisfy one of the allowed_domain_suffixes below before the collector can
    # reach it. Fields of any other type are ignored by that policy.
    label: Tenant hostname
    field_type: hostname
    required: true
    placeholder: "acme.goskope.com"
    help: >-
      Your Netskope tenant hostname, without scheme or path. Find it in the URL
      you use to log in to the Netskope admin console.
  - name: INDEX_NAME
    label: Iterator name
    field_type: string
    required: false
    placeholder: "nano"
    help: >-
      Netskope tracks read position server-side under this name. Leave as
      "nano" unless another consumer already uses it — two consumers sharing an
      iterator name will steal each other's events.

allowed_domain_suffixes:
  - ".goskope.com"

streams:
  - id: alert
    label: Alerts
    source_type: netskope_alert
    parser: netskope_ocsf
    default: true
    description: "Policy, DLP, malware, anomaly and compromised-credential alerts"
  - id: application
    label: Application events
    source_type: netskope_application
    parser: netskope_ocsf
    default: true
    description: "Sanctioned and shadow-IT app activity, including file operations"
  - id: network
    label: Network events
    source_type: netskope_network
    parser: netskope_ocsf
    default: true
    description: "Netskope Private Access and firewall-level connection records"
  - id: audit
    label: Audit events
    source_type: netskope_audit
    parser: netskope_ocsf
    default: true
    description: "Administrator actions in the Netskope tenant"
  - id: page
    label: Page events
    source_type: netskope_page
    parser: netskope_ocsf
    default: false
    description: "Per-page web browsing records. High volume — enable deliberately."
  - id: connection
    label: Connection events
    source_type: netskope_connection
    parser: netskope_ocsf
    default: false
    description: "Per-connection records. High volume — enable deliberately."
  - id: incident
    label: Incidents
    source_type: netskope_incident
    parser: netskope_ocsf
    default: false
    description: "DLP and threat-protection incident records"
  - id: infrastructure
    label: Infrastructure events
    source_type: netskope_infrastructure
    parser: netskope_ocsf
    default: false
    description: "Netskope infrastructure and tunnel health"
  - id: endpoint
    label: Endpoint events
    source_type: netskope_endpoint
    parser: netskope_ocsf
    default: false
    description: "Endpoint DLP events from the Netskope client"

config:
  poll_schedule: "*/5 * * * *"
  max_run_secs: 900
  max_events_per_emit: 10000

tags:
  - casb
  - sse
  - dlp
  - netskope

# NAN-3490: connector.yaml is the declarative nano-connector spec that
# replaces code.ts. `runtime` picks which one nano runs; it stays `deno` until
# cutover, and the shadow-run harness keeps the two event-for-event identical.
runtime: deno
connector_spec: connector.yaml
