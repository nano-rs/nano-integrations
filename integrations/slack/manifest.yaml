name: Slack
slug: slack
category: collector
description: "Pull workspace sign-in records from Slack access logs (needs the `admin` scope — not available on Pro)"
icon: message-square
author: nano
version: 3
changelog: >-
  v3: report a stream failure in the shape nano can attribute. This collector
  threw straight out of collect, so the host had no structured log to recover
  the stream name from and the per-stream last_error stayed NULL — a broken
  connection looked identical to a quiet one in the UI. Failures now log
  "Stream failed" with the stream and error before rethrowing; the run still
  fails. Observability only, no collection behaviour changes.
  v2: the access-log stream now names the parser it needs (parser: slack_access)
  instead of relying on that parser to claim the slack_access_log source type.
  Resolution no longer depends on the parsers repo keeping that alias, so a
  parser-repo tidy-up can't silently leave the stream collecting unparsed. No
  behaviour change on its own; update before the parsers repo drops the alias.
  v1: initial release — team.accessLogs sign-in records.

auth_type: bearer
auth:
  credential_field: USER_TOKEN

requires_credential: required
credential_fields:
  - name: USER_TOKEN
    label: User token
    field_type: secret
    required: true
    help: >-
      A Slack *user* token (starts with xoxp-) carrying the `admin` scope.
      Create an app at api.slack.com/apps, add `admin` under User Token Scopes,
      install it to your workspace, and copy the User OAuth Token.

      REQUIRES the `admin` scope to be grantable on your workspace. It is NOT
      offered in the scope picker on Pro — verified on a Pro workspace, where
      `admin` simply does not appear. The team.accessLogs *method* is documented
      as Pro/Business+, but the scope that unlocks it is not, so in practice this
      integration needs Business+ or Enterprise Grid. Check the User Token Scopes
      picker before configuring: if `admin` is absent, this collector cannot work
      for you.

      A bot token (xoxb-) will not work — access logs are only readable with a
      user token. Leave "Advanced token security via token rotation" OFF: it
      expires tokens every 12 hours and nano has no refresh flow yet.

config_fields:
  - name: TEAM_ID
    label: Team ID
    field_type: string
    required: false
    placeholder: "T0123456789"
    help: >-
      Only needed for org-level tokens on Enterprise Grid, to say which workspace
      to read. Leave blank for a normal workspace token.

# Fixed host — Slack is not per-tenant, so there is nothing to template and no
# suffix allowlist is needed.
allowed_domains:
  - slack.com

streams:
  - id: access_logs
    label: Sign-in records
    source_type: slack_access_log
    parser: slack_access
    default: true
    description: "Who signed in, from which IP, device and network"

config:
  # Tier 2 rate limit is ~20 requests/minute, and the whole workspace's sign-in
  # history is a few pages. Hourly is plenty; polling harder just burns quota
  # against records that barely change.
  poll_schedule: "0 * * * *"
  max_run_secs: 300
  max_events_per_emit: 1000

tags:
  - saas
  - authentication
  - slack
