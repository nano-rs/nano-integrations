# Hosted variant of connector.yaml (NAN-3490): identical collection, KEYLESS auth.
# nano's hosted runner gets a domain-wide-delegation assertion signed by the
# tenant's OWN nano service account (nano-t-<hash>@nano-pull-prod) from the pull
# broker (STS -> iamcredentials signJwt; no key exists anywhere), then exchanges
# it at oauth2.googleapis.com. The Workspace admin authorizes that service
# account's client ID for the reports scope. connector.yaml keeps key-based
# google_service_account auth for self-hosted / open core and the shadow harness.
version: 1
name: google_workspace
kind: collector
allow:
  - host: admin.googleapis.com
    path_prefixes: ["/admin/reports/v1/activity/users/all/applications/"]
  - host: oauth2.googleapis.com
    path_prefixes: ["/token"]
auth:
  type: google_dwd_broker
  token_url: "https://oauth2.googleapis.com/token"
  scope: "https://www.googleapis.com/auth/admin.reports.audit.readonly"
  subject: "{{config.ADMIN_EMAIL}}"
# Every 5 min (NAN-3783, the pull default). The Reports API has no documented
# minimum poll interval; lookback_secs below re-reads 10 min for late events.
schedule: "*/5 * * * *"
limits: { max_run_secs: 600, max_pages: 2000 }
rate_limit: { min_interval_ms: 250, max_retries_429: 5, max_wait_ms: 60000 }
streams:
  - id: activities
    source_type: "gws_{{item}}"
    fanout:
      discover: { from: config, key: STREAMS }
      concurrency: 4
    request:
      url: "https://admin.googleapis.com/admin/reports/v1/activity/users/all/applications/{{item}}"
      query:
        startTime: "{{window.start}}"
        endTime: "{{window.end}}"
        maxResults: "1000"
      headers: { Accept: application/json }
    response: { events_path: items }
    pagination: { type: token, from: nextPageToken, param: pageToken }
    # uniqueQualifier is unique only together with the event time; the same
    # composite as the google_workspace_ocsf parser's metadata.uid.
    ingest_id: { fields: [id.applicationName, id.customerId, id.uniqueQualifier, id.time] }
    window:
      time_field: id.time
      uid_field: id.uniqueQualifier
      max_span_secs: 3600
      lag_secs: 60
      lookback_secs: 600
      # The first window starts at the engine's initial cursor (activation -
      # 5 min, NAN-3697) whatever this says; initial_lookback_secs only bounds
      # the tenant checkpoint-reset API.
      initial_lookback_secs: 86400
